  automation_rules_settings_scheduler: Scheduled rules
  automation_rules_settings_scheduler_info: Rules with the "Scheduled" trigger are evaluated by the checker, which runs from cron, from web requests or from an external scheduler calling the check URL. Event rules do not need it.
