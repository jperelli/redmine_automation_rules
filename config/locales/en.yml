  label_automation_rules_scheduler_mode_cron: Cron / rake task (rake redmine:check_automation_rules)
  label_automation_rules_scheduler_mode_web: Automatic on web requests (no cron needed)
  label_automation_rules_scheduler_mode_info: With "Automatic on web requests" due scheduled rules are checked in the background whenever someone uses Redmine, so no cron job is needed. Nothing runs while nobody visits; the rules run on the next visit.
