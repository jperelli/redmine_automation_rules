  label_automation_rules_plugin_name: Plugin Automation Rules
  label_automation_rules_credit_by: por
  automation_rules_settings_scheduler: Reglas planificadas
  automation_rules_settings_scheduler_info: Las reglas con el disparador "Planificada" las evalúa el verificador, que se ejecuta desde cron, desde las peticiones web o desde un planificador externo que llama a la URL de verificación. Las reglas por eventos no lo necesitan.
  label_automation_rules_scheduler_mode: Planificador
  label_automation_rules_scheduler_mode_cron: Cron / tarea rake (rake redmine:check_automation_rules)
  label_automation_rules_scheduler_mode_web: Automático en las peticiones web (sin cron)
  label_automation_rules_scheduler_mode_info: Con "Automático en las peticiones web" las reglas planificadas pendientes se verifican en segundo plano cada vez que alguien usa Redmine, así no hace falta un cron. Mientras nadie visita el sitio no se ejecuta nada; las reglas se ejecutan en la siguiente visita.
  label_automation_rules_web_check_interval: Intervalo de verificación web
  label_automation_rules_web_check_interval_info: Con qué frecuencia, como máximo, una petición web dispara el verificador. Solo se usa con "Automático en las peticiones web".
  label_automation_rules_minutes: minutos
  label_automation_rules_check_url: URL de verificación
  label_automation_rules_check_url_info: Llame a esta URL desde cualquier planificador externo (monitor de disponibilidad, cron de CI, Programador de tareas de Windows...) para ejecutar el verificador a demanda. Requiere "Activar WS para la gestión de repositorios" y su clave de API (Administración > Configuración > Repositorios).
  label_automation_rules_runs: Registro del planificador (últimas %{count} ejecuciones)
  label_automation_rules_runs_info: Cada ejecución del verificador queda registrada aquí, sea cual sea su origen (rake/cron, peticiones web, URL de verificación o este botón). Las ejecuciones consecutivas que no cambiaron nada se agrupan en una sola fila.
  button_automation_rules_run_checker: Ejecutar el verificador ahora
  text_automation_rules_run_checker_confirm: ¿Ejecutar el verificador de reglas planificadas ahora? Se evaluarán todas las reglas planificadas pendientes y se aplicarán sus acciones.
  notice_automation_rules_checker_run: "Verificador ejecutado: %{count} regla(s) planificada(s) evaluada(s)."
